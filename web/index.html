  <meta charset="UTF-8">

  <meta name="mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>app_pruebas</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCJOqQ6Xedz-lx-KLJJpvOYkwORkNDTGBg&v=weekly&libraries=places"></script>
  <script>
    window.getGooglePlacePhoto = async function(query, callback) {
      try {
        if (!window.google || !window.google.maps) {
          callback(null);
          return;
        }

        // 1. Usar la API moderna de Places (Place.searchByText) recomendada a partir de 2025
        var PlaceClass = null;
        if (google.maps.places && google.maps.places.Place) {
          PlaceClass = google.maps.places.Place;
        } else if (google.maps.importLibrary) {
          try {
            var lib = await google.maps.importLibrary("places");
            PlaceClass = lib.Place;
          } catch (_) {}
        }

        if (PlaceClass && typeof PlaceClass.searchByText === 'function') {
          var request = {
            textQuery: query,
            fields: ['displayName', 'photos'],
          };
          var result = await PlaceClass.searchByText(request);
          var places = result ? result.places : null;
          if (places && places.length > 0 && places[0].photos && places[0].photos.length > 0) {
            // getURI retorna la URL directa a lh3.googleusercontent.com con CORS habilitado
            var photoUri = places[0].photos[0].getURI({ maxWidthPx: 800, maxHeightPx: 600 });
            if (photoUri) {
              callback(photoUri);
              return;
            }
          }
        }

        // 2. Fallback a PlacesService tradicional si Place.searchByText no estuviese disponible
        if (google.maps.places && google.maps.places.PlacesService) {
          var dummyDiv = document.createElement('div');
          var service = new google.maps.places.PlacesService(dummyDiv);
          service.findPlaceFromQuery({
            query: query,
            fields: ['name', 'photos']
          }, function(results, status) {
            if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length > 0) {
              var place = results[0];
              if (place.photos && place.photos.length > 0) {
                var photoUrl = place.photos[0].getUrl({ maxWidth: 800, maxHeight: 600 });
                callback(photoUrl);
                return;
              }
            }
            callback(null);
          });
          return;
        }

        callback(null);
      } catch (e) {
        console.warn('Error in getGooglePlacePhoto:', e);
        callback(null);
      }
    };
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Limpieza de Service Workers obsoletos para forzar la última versión inmediatamente
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.update();
        }
      });
    }
  </script>
  <script>
    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + new Date().getTime();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
